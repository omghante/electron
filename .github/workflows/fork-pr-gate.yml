name: "Fork PR Validation Gate"

# FORK-ONLY: Required status check on every PR inside the fork.
# No skip conditions — all jobs always run.

on:
  pull_request:
    branches:
      - main
      - "feature/**"
      - "ci/**"
      - "build/**"
    types: [opened, synchronize, reopened, ready_for_review]

defaults:
  run:
    shell: bash

concurrency:
  group: fork-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Guard ─────────────────────────────────────────────────────────────────
  repo-guard:
    name: "🔒 Fork Repo Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Enforce fork-only execution
        run: |
          if [[ "${{ github.repository }}" == "electron/electron" ]]; then
            echo "::error::PR gate must NOT run on upstream electron/electron."
            exit 1
          fi
          echo "✅ Fork: ${{ github.repository }}"

  # ── Lint & TypeCheck ──────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & TypeCheck"
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Read .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: nm-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: TypeScript – scripts
        run: yarn tsc -p tsconfig.script.json --noEmit

      - name: TypeScript – electron
        run: yarn tsc -p tsconfig.electron.json --noEmit

  # ── Workflow safety check ─────────────────────────────────────────────────
  workflow-safety-check:
    name: "🛡️ Workflow Safety Check"
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check for upstream-only runner references
        run: |
          FORBIDDEN="electron-arc-centralus\|electron-arc-eastus\|ubuntu-slim"
          FOUND=$(grep -r "$FORBIDDEN" .github/workflows/fork-*.yml 2>/dev/null || true)
          if [[ -n "$FOUND" ]]; then
            echo "::error::Fork workflows must NOT use upstream ARC runners."
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No forbidden runner references in fork workflows."

      - name: Ensure all fork workflows have repo guards
        run: |
          FAIL=0
          for f in .github/workflows/fork-*.yml; do
            if ! grep -q "github.repository" "$f"; then
              echo "::error::$f is missing a github.repository guard!"
              FAIL=1
            fi
          done
          [[ $FAIL -eq 0 ]] && echo "✅ All fork workflows have repo guards."
          exit $FAIL

      - name: Check PR is not targeting upstream
        run: |
          BASE="${{ github.event.pull_request.base.repo.full_name }}"
          if [[ "$BASE" == "electron/electron" ]]; then
            echo "::error::This PR targets upstream electron/electron directly!"
            echo "::error::PRs to upstream must only be created AFTER fork CI passes."
            exit 1
          fi
          echo "✅ PR targets fork repository — OK."

  # ── PR metadata check ─────────────────────────────────────────────────────
  pr-meta-check:
    name: "📝 PR Metadata Check"
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PREFIXES="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+"
          if [[ ! "$PR_TITLE" =~ $PREFIXES ]]; then
            echo "::warning::PR title does not follow conventional commits."
            echo "  Expected: <type>(<scope>): <description>"
            echo "  Got: $PR_TITLE"
          else
            echo "✅ PR title is valid: $PR_TITLE"
          fi

  # ── Final gate ────────────────────────────────────────────────────────────
  pr-gate:
    name: "🚦 PR Gate – Ready for Review"
    needs: [lint, workflow-safety-check, pr-meta-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          LINT="${{ needs.lint.result }}"
          SAFETY="${{ needs.workflow-safety-check.result }}"
          META="${{ needs.pr-meta-check.result }}"

          FAIL=0
          [[ "$LINT" == "failure" || "$LINT" == "cancelled" ]] && \
            echo "::error::Lint check failed." && FAIL=1
          [[ "$SAFETY" == "failure" || "$SAFETY" == "cancelled" ]] && \
            echo "::error::Workflow safety check failed." && FAIL=1

          if [[ $FAIL -eq 1 ]]; then
            echo "🚫 PR is NOT valid."
            exit 1
          fi
          echo "✅ PR gate passed. Safe to merge."
