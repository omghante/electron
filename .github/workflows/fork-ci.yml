name: "Fork CI – Lint & Validate"

# FORK-ONLY: Runs on all pushes to feature/fix/ci/build branches and all PRs to main.
# No skip conditions — every job always runs.

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - "build/**"
      - "build"
      - "chore/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

defaults:
  run:
    shell: bash

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Guard: abort if somehow run on upstream ────────────────────────────────
  repo-guard:
    name: "🔒 Fork Repo Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Verify this is the fork
        run: |
          if [[ "${{ github.repository }}" == "electron/electron" ]]; then
            echo "::error::This workflow must NOT run on upstream electron/electron."
            exit 1
          fi
          echo "✅ Running on fork: ${{ github.repository }}"

  # ── Lint & TypeCheck ─────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Type Check"
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read .nvmrc
        id: nvmrc
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.NODE_VERSION }}
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint

      - name: TypeScript – scripts
        run: yarn tsc -p tsconfig.script.json --noEmit

      - name: TypeScript – electron
        run: yarn tsc -p tsconfig.electron.json --noEmit

  # ── Patch file validation ─────────────────────────────────────────────────
  patches:
    name: "🩹 Patch Validation"
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify patch files are well-formed
        run: |
          echo "Checking patch directory structure..."
          find patches/ -name "*.patch" 2>/dev/null | while read -r p; do
            if ! git apply --check --stat "$p" 2>/dev/null; then
              echo "::warning::Patch may not apply cleanly: $p"
            fi
          done
          echo "Patch check complete."

      - name: Ensure no upstream-only secrets in patches
        run: |
          FORBIDDEN="CHROMIUM_GIT_COOKIE\|PATCH_UP_APP_CREDS\|DD_API_KEY"
          if grep -r "$FORBIDDEN" patches/ 2>/dev/null; then
            echo "::error::Patches must not reference upstream-only secrets."
            exit 1
          fi
          echo "✅ No forbidden secret references in patches."

  # ── Workflow safety check ─────────────────────────────────────────────────
  workflow-safety:
    name: "🛡️ Fork Workflow Safety"
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ensure all fork workflows have repo guards
        run: |
          FAIL=0
          for f in .github/workflows/fork-*.yml; do
            if ! grep -q "github.repository" "$f"; then
              echo "::error::$f is missing a github.repository guard!"
              FAIL=1
            fi
          done
          [[ $FAIL -eq 0 ]] && echo "✅ All fork workflows have repo guards."
          exit $FAIL

      - name: Check for upstream ARC runners in fork workflows
        run: |
          FORBIDDEN="electron-arc-centralus\|electron-arc-eastus\|ubuntu-slim"
          FOUND=$(grep -r "$FORBIDDEN" .github/workflows/fork-*.yml 2>/dev/null || true)
          if [[ -n "$FOUND" ]]; then
            echo "::error::Fork workflows must NOT use upstream ARC runners."
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No forbidden runner references in fork workflows."

  # ── Required gate ─────────────────────────────────────────────────────────
  fork-ci-complete:
    name: "✅ Fork CI Complete"
    needs: [lint, patches, workflow-safety]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          LINT="${{ needs.lint.result }}"
          PATCHES="${{ needs.patches.result }}"
          SAFETY="${{ needs.workflow-safety.result }}"

          FAIL=0
          [[ "$LINT" == "failure" || "$LINT" == "cancelled" ]] && \
            echo "::error::Lint failed." && FAIL=1
          [[ "$PATCHES" == "failure" || "$PATCHES" == "cancelled" ]] && \
            echo "::error::Patch validation failed." && FAIL=1
          [[ "$SAFETY" == "failure" || "$SAFETY" == "cancelled" ]] && \
            echo "::error::Workflow safety check failed." && FAIL=1

          [[ $FAIL -eq 0 ]] && echo "🎉 All fork CI checks passed."
          exit $FAIL
